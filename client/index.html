<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3EE" />

    <!-- Favicons: SVG for modern browsers, .ico and apple-touch-icon as fallbacks (add these files to client/public) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Fonts: Fraunces (display), Figtree (body), Caveat (handwritten notes). display=swap keeps text visible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap"
    />

    <!-- Default tags. Each page updates these through the <Seo /> component. -->
    <title>Custom Sofa Manufacturer in Whitefield, Bangalore | Fashionable Decor</title>
    <meta
      name="description"
      content="Fashionable Decor makes custom-made sofas in Whitefield, Bangalore. Our own team builds the frame and does the stitching and finishing. Also recliners, beds, headboards, dining, curtains and wallpaper."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fashionable Decor" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Custom Sofa Manufacturer in Whitefield, Bangalore | Fashionable Decor" />
    <meta
      property="og:description"
      content="Custom-made sofas by our own team in Whitefield, Bangalore. Enquire on WhatsApp."
    />
    <meta property="og:image" content="/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/hero.jpg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
